name: "💡 Feature Request"
description: "Suggest an idea, media player integration, or enhancement for Win App Tracker."
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement or new feature for Win App Tracker!

  - type: dropdown
    id: component
    attributes:
      label: Target Subsystem
      description: Which part of the ecosystem does this feature apply to?
      options:
        - "Video Detector HUD"
        - "Browser Data Hub"
        - "Browser Detection Extension"
        - "Anti-Gravity Detector"
        - "Audio Detector"
        - "Game Detector"
        - "Keyboard and Mouse Detector"
        - "New Detector Architecture"
        - "General / Other"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of the limitation or problem.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or workarounds you have considered.

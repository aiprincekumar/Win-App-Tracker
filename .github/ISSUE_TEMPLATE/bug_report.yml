name: "🐛 Bug Report"
description: "Report a bug, inaccurate detector evaluation, or crash in Win App Tracker."
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us reproduce and fix it quickly.

  - type: dropdown
    id: component
    attributes:
      label: Subsystem / Component
      description: Which detector or component is affected?
      options:
        - "Video Detector HUD"
        - "Browser Data Hub"
        - "Browser Detection Extension"
        - "Anti-Gravity Detector"
        - "Audio Detector"
        - "Game Detector"
        - "Keyboard and Mouse Detector"
        - "Video Detector (Standalone)"
        - "Other / Build / CI"
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating System Version
      description: e.g. Windows 11 23H2 (Build 22631.3007) or Windows 10 22H2
      placeholder: Windows 11 Home 64-bit Build 22631
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: e.g. Python 3.11.8 or Python 3.10.12
      placeholder: Python 3.11.8
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: Clear and concise description of what the bug is.
      placeholder: When running the detector, the state indicates...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open '...'
        2. Execute '...'
        3. Observe error '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs & Error Output
      description: Paste any error messages, terminal logs, or exceptions here.
      render: shell
